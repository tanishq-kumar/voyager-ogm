name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # =========================================================================
  # 1. Fast Lint & Code Style Gate
  # =========================================================================
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        continue-on-error: true
        with:
          workspaces: |
            .
            crates/*

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dev Dependencies
        run: uv sync --extra dev

      - name: Check Rust Formatting
        run: cargo fmt --all --check

      - name: Run Clippy Linters
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check Python Formatting (Ruff)
        run: uv run --extra dev ruff format --check .

      - name: Run Python Linters (Ruff)
        run: uv run --extra dev ruff check .

      - name: Check Python Types (ty)
        run: uv run --extra dev ty check packages/python/voyager_ogm

  # =========================================================================
  # 2. Rust Core Engine Test Matrix
  # =========================================================================
  test-rust:
    name: Rust Core (${{ matrix.os }})
    needs: [lint]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        continue-on-error: true
        with:
          workspaces: |
            .
            crates/*

      - name: Install cargo-nextest
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: nextest

      - name: Run Rust Nextest Suite
        run: cargo nextest run --workspace --all-targets

  # =========================================================================
  # 3. Python SDK Multi-Python & Multi-OS Test Matrix
  # =========================================================================
  test-python:
    name: Python SDK (${{ matrix.os }}, Py ${{ matrix.python-version }})
    needs: [lint]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        continue-on-error: true
        with:
          workspaces: |
            .
            crates/*

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install Dev Dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Build Native Python Extension (maturin develop)
        run: uv run --extra dev --python ${{ matrix.python-version }} maturin develop --uv

      - name: Run Pytest Suite
        run: uv run --extra dev --python ${{ matrix.python-version }} pytest

  # =========================================================================
  # 4. Consolidated CI Gate (Required Status Check for Branch Protection)
  # =========================================================================
  ci-gate:
    name: CI Gate
    if: always()
    needs: [lint, test-rust, test-python]
    runs-on: ubuntu-latest
    steps:
      - name: Verify All Matrix Jobs Passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more CI matrix jobs failed or were cancelled."
            exit 1
          fi
          echo "All CI jobs completed successfully."

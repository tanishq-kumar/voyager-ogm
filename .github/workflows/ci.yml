name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Runs once per opened PR and once per push. Label and other metadata
    # changes do not trigger CI; jobs read the PR's current labels at run time
    # (see the `changes` job), so a re-run picks up a label added later.
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # =========================================================================
  # 1. Path Change Detection
  # =========================================================================
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      net: ${{ steps.filter.outputs.net }}
      full_ci: ${{ steps.labels.outputs.full_ci == 'true' }}
      skip_changelog: ${{ steps.labels.outputs.skip_changelog == 'true' }}
    steps:
      # Read the PR's labels live rather than from the event payload: labels added
      # right after the PR is opened, or before a manual re-run, are not in the
      # payload snapshot.
      - name: Read Current PR Labels
        id: labels
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          labels="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.labels[].name')"
          echo "Current PR labels: ${labels:-<none>}"
          if grep -qx 'full-ci' <<<"$labels"; then echo "full_ci=true" >> "$GITHUB_OUTPUT"; else echo "full_ci=false" >> "$GITHUB_OUTPUT"; fi
          if grep -qx 'skip-changelog' <<<"$labels"; then echo "skip_changelog=true" >> "$GITHUB_OUTPUT"; else echo "skip_changelog=false" >> "$GITHUB_OUTPUT"; fi

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect File Changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          token: ${{ github.token }}
          filters: |
            rust:
              - 'crates/**'
              - 'fuzz/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain*'
              - 'test_data/**'
              - 'tests/**'
              - '.github/workflows/ci.yml'
            net:
              - 'crates/voyager-drivers/**'
              - 'fuzz/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain*'
              - '.github/workflows/ci.yml'
            python:
              - 'crates/**'
              - 'packages/python/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'test_data/**'
              - 'tests/**'
              - '.github/workflows/ci.yml'

  # =========================================================================
  # 2. Fast Lint & Code Style Gate (Runs on All Commits/PRs)
  # =========================================================================
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        continue-on-error: true
        with:
          workspaces: |
            .
            crates/*

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dev Dependencies
        run: uv sync --all-extras --all-groups

      - name: Check Rust Formatting
        run: cargo fmt --all --check

      - name: Run Clippy Linters
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check Python Formatting (Ruff)
        run: uv run --all-extras ruff format --check .

      - name: Run Python Linters (Ruff)
        run: uv run --all-extras ruff check .

      - name: Check Python Types (ty)
        run: uv run --all-extras ty check packages/python/voyager_ogm

      - name: Check Python Types (mypy)
        run: uv run --all-extras mypy packages/python/voyager_ogm

  # =========================================================================
  # 2b. Cargo Feature Combination Check (cheap clippy gate, no test runs)
  # =========================================================================
  feature-combinations:
    name: Feature Combinations
    needs: [changes]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.full_ci == 'true' ||
      needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        continue-on-error: true
        with:
          workspaces: |
            .
            crates/*

      - name: Check voyager-ogm feature combinations
        run: |
          cargo clippy -p voyager-ogm --no-default-features -- -D warnings
          cargo clippy -p voyager-ogm --no-default-features --features serde -- -D warnings
          cargo clippy -p voyager-ogm --no-default-features --features arrow -- -D warnings
          cargo clippy -p voyager-ogm -- -D warnings

      - name: Check voyager-drivers feature combinations
        run: |
          cargo clippy -p voyager-drivers --no-default-features --features bolt -- -D warnings
          cargo clippy -p voyager-drivers --no-default-features --features postgres -- -D warnings
          cargo clippy -p voyager-drivers --no-default-features --features redis -- -D warnings
          cargo clippy -p voyager-drivers --no-default-features --features arrow -- -D warnings
          cargo clippy -p voyager-drivers -- -D warnings
          cargo clippy -p voyager-drivers --all-features -- -D warnings

  # =========================================================================
  # 3. Changelog Conformance & Unreleased Gate
  # =========================================================================
  changelog:
    name: Changelog Gate
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate CHANGELOG.md Format
        run: python3 scripts/check_changelog.py --format

      - name: Verify Unreleased Changelog Entry
        if: github.event_name == 'pull_request' && needs.changes.outputs.skip_changelog != 'true'
        run: python3 scripts/check_changelog.py --require-unreleased-change origin/${{ github.base_ref }}

  # =========================================================================
  # 3b. Supply-Chain Security & Dependency Hygiene Gate
  # =========================================================================
  supply-chain:
    name: Supply Chain & Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Cargo Deny (Advisories, Bans, Licenses, Sources)
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check

      - name: Install cargo-machete
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-machete

      - name: Check Unused Dependencies (cargo-machete)
        run: cargo machete

      - name: Scan Vulnerabilities (osv-scanner)
        uses: google/osv-scanner-action/osv-scanner-action@d3c1414ded37de590f207572e37a7d180f1d0ef7 # v2.7.1
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=Cargo.lock
            --lockfile=uv.lock

  # =========================================================================
  # 4. Rust Core Engine Test Matrix
  # =========================================================================
  test-rust:
    name: Rust Core (${{ matrix.os }})
    needs: [changes, lint]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.full_ci == 'true' ||
      needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.full_ci == 'true') && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        continue-on-error: true
        with:
          workspaces: |
            .
            crates/*

      - name: Install cargo-nextest
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: nextest

      - name: Run Rust Nextest Suite
        run: cargo nextest run --workspace --all-targets

  # =========================================================================
  # 4. Python SDK Multi-Python & Multi-OS Test Matrix
  # =========================================================================
  test-python:
    name: Python SDK (${{ matrix.os }}, Py ${{ matrix.python-version }})
    needs: [changes, lint]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.full_ci == 'true' ||
      needs.changes.outputs.python == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.full_ci == 'true') && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
        python-version: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.full_ci == 'true') && fromJSON('["3.11", "3.12", "3.13", "3.14"]') || fromJSON('["3.11", "3.12"]') }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        continue-on-error: true
        with:
          workspaces: |
            .
            crates/*

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install Dev Dependencies
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      - name: Build Native Python Extension (maturin develop)
        run: uv run --all-extras --python ${{ matrix.python-version }} maturin develop --uv

      - name: Run Pytest Suite (Unit & Functional Tests)
        run: uv run --all-extras --python ${{ matrix.python-version }} pytest -m "not live"

  # =========================================================================
  # 5. Wire Protocol Fuzzing & Memory Sanitizers (AddressSanitizer / LeakSanitizer)
  # =========================================================================
  sanitizer-and-fuzz:
    name: Memory Sanitizer & Fuzz (Linux)
    needs: [changes, lint]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.full_ci == 'true' ||
      needs.changes.outputs.net == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust Nightly Toolchain (for Sanitizers & cargo-fuzz)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: nightly-2026-09-01
          targets: x86_64-unknown-linux-gnu
          components: rust-src

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        continue-on-error: true
        with:
          workspaces: |
            .
            crates/*
            fuzz

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-fuzz

      - name: Run AddressSanitizer & LeakSanitizer on Wire Protocol Tests
        env:
          RUSTFLAGS: "-Zsanitizer=address"
          ASAN_OPTIONS: "detect_leaks=1"
        run: cargo test -p voyager-drivers --test wire_fuzz_tests --target x86_64-unknown-linux-gnu

      - name: Smoke Test PackStream Fuzz Target
        run: cargo fuzz run fuzz_packstream --target x86_64-unknown-linux-gnu -- -runs=1000 -max_total_time=15

      - name: Smoke Test RESP Fuzz Target
        run: cargo fuzz run fuzz_resp --target x86_64-unknown-linux-gnu -- -runs=1000 -max_total_time=15

  # =========================================================================
  # 6. Consolidated CI Gate (Required Status Check for Branch Protection)
  # =========================================================================
  ci-gate:
    name: CI Gate
    if: always()
    needs: [lint, feature-combinations, changelog, supply-chain, changes, test-rust, test-python, sanitizer-and-fuzz]
    runs-on: ubuntu-latest
    steps:
      - name: Verify All Matrix Jobs Passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more CI matrix jobs failed or were cancelled."
            exit 1
          fi
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "::error::Lint and code quality checks must pass."
            exit 1
          fi
          if [[ "${{ needs.changelog.result }}" != "success" ]]; then
            echo "::error::Changelog checks must pass (update CHANGELOG.md [Unreleased] or apply skip-changelog label)."
            exit 1
          fi
          if [[ "${{ needs.supply-chain.result }}" != "success" ]]; then
            echo "::error::Supply-chain security checks must pass."
            exit 1
          fi
          echo "All CI jobs completed successfully."

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # =========================================================================
  # 1. Path Change Detection
  # =========================================================================
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect File Changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          token: ${{ github.token }}
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain*'
              - 'test_data/**'
              - 'tests/**'
              - '.github/workflows/ci.yml'
            python:
              - 'crates/**'
              - 'packages/python/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'test_data/**'
              - 'tests/**'
              - '.github/workflows/ci.yml'

  # =========================================================================
  # 2. Fast Lint & Code Style Gate (Runs on All Commits/PRs)
  # =========================================================================
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true
        with:
          workspaces: |
            .
            crates/*

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dev Dependencies
        run: uv sync --all-extras --all-groups

      - name: Check Rust Formatting
        run: cargo fmt --all --check

      - name: Run Clippy Linters
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check Python Formatting (Ruff)
        run: uv run --all-extras ruff format --check .

      - name: Run Python Linters (Ruff)
        run: uv run --all-extras ruff check .

      - name: Check Python Types (ty)
        run: uv run --all-extras ty check packages/python/voyager_ogm

      - name: Check Python Types (mypy)
        run: uv run --all-extras mypy packages/python/voyager_ogm

  # =========================================================================
  # 3. Rust Core Engine Test Matrix
  # =========================================================================
  test-rust:
    name: Rust Core (${{ matrix.os }})
    needs: [changes, lint]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci') ||
      needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true
        with:
          workspaces: |
            .
            crates/*

      - name: Install cargo-nextest
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: nextest

      - name: Run Rust Nextest Suite
        run: cargo nextest run --workspace --all-targets

  # =========================================================================
  # 4. Python SDK Multi-Python & Multi-OS Test Matrix
  # =========================================================================
  test-python:
    name: Python SDK (${{ matrix.os }}, Py ${{ matrix.python-version }})
    needs: [changes, lint]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci') ||
      needs.changes.outputs.python == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
        python-version: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && fromJSON('["3.11", "3.12", "3.13", "3.14"]') || fromJSON('["3.11", "3.12"]') }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true
        with:
          workspaces: |
            .
            crates/*

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install Dev Dependencies
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      - name: Build Native Python Extension (maturin develop)
        run: uv run --all-extras --python ${{ matrix.python-version }} maturin develop --uv

      - name: Run Pytest Suite (Unit & Functional Tests)
        run: uv run --all-extras --python ${{ matrix.python-version }} pytest -m "not live"

  # =========================================================================
  # 5. Consolidated CI Gate (Required Status Check for Branch Protection)
  # =========================================================================
  ci-gate:
    name: CI Gate
    if: always()
    needs: [lint, changes, test-rust, test-python]
    runs-on: ubuntu-latest
    steps:
      - name: Verify All Matrix Jobs Passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more CI matrix jobs failed or were cancelled."
            exit 1
          fi
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "::error::Lint and code quality checks must pass."
            exit 1
          fi
          echo "All CI jobs completed successfully."

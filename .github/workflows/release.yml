name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. Verify Release Integrity (Tag vs Manifests and Changelog)
  # =========================================================================
  verify:
    name: Verify Release Tag and Notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      latest: ${{ steps.latest.outputs.latest }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and every tag: the Latest-release decision compares this
          # tag against all other v* tags, and reachability needs the branch refs.
          fetch-depth: 0

      - name: Verify Tag Is Reachable from main or Its Release Branch
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "${VERSION}" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+([-+].*)?$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not a SemVer vX.Y.Z tag."
            exit 1
          fi
          LINE="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"

          if git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "Tag commit $(git rev-parse --short HEAD) is reachable from origin/main."
            exit 0
          fi

          RELEASE_REF="refs/remotes/origin/release/${LINE}"
          if git rev-parse -q --verify "${RELEASE_REF}" >/dev/null \
            && git merge-base --is-ancestor HEAD "${RELEASE_REF}"; then
            echo "Tag commit $(git rev-parse --short HEAD) is reachable from origin/release/${LINE}."
            exit 0
          fi

          echo "::error::Tag '${GITHUB_REF_NAME}' points to a commit that is not reachable from origin/main or origin/release/${LINE}; refusing to publish."
          exit 1

      - name: Verify Tag against Cargo.toml and CHANGELOG.md
        id: check
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

          # Check if tag is pre-release (contains hyphen, e.g. 0.4.0-alpha.7)
          if [[ "${VERSION}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

          echo "Checking Cargo.toml version equals '${VERSION}'..."
          CARGO_VERSION=$(python3 -c "
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path('Cargo.toml').read_text(encoding='utf-8'))
          print(data['workspace']['package']['version'])
          ")

          if [[ "${CARGO_VERSION}" != "${VERSION}" ]]; then
            echo "::error::Tag '${TAG}' does not match workspace Cargo.toml version '${CARGO_VERSION}'!"
            exit 1
          fi

          echo "Checking CHANGELOG.md for dated section '[${VERSION}]'..."
          python3 scripts/check_changelog.py --format
          NOTES=$(python3 scripts/check_changelog.py --extract "${VERSION}")
          if [[ -z "${NOTES}" ]]; then
            echo "::error::No release notes found in CHANGELOG.md for version '${VERSION}'!"
            exit 1
          fi

          echo "Release verification passed for ${TAG}."

      - name: Determine Whether This Tag Is the Latest Release
        id: latest
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mapfile -t TAGS < <(git tag --list 'v*')
          LATEST=$(python3 - "${VERSION}" "${TAGS[@]}" <<'PY'
          import re
          import sys

          SEMVER_RE = re.compile(
              r"^(?P<major>0|[1-9][0-9]*)\.(?P<minor>0|[1-9][0-9]*)\.(?P<patch>0|[1-9][0-9]*)"
              r"(?:-(?P<pre>[0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$"
          )


          def parse(version):
              match = SEMVER_RE.fullmatch(version)
              if match is None:
                  return None
              core = (int(match["major"]), int(match["minor"]), int(match["patch"]))
              pre = match["pre"]
              if pre is None:
                  return core + ((1, ()),)
              identifiers = []
              for identifier in pre.split("."):
                  if identifier.isdigit():
                      identifiers.append((0, int(identifier)))
                  else:
                      identifiers.append((1, identifier))
              return core + ((0, tuple(identifiers)),)


          version = sys.argv[1]
          current = parse(version)
          # Pre-releases are never the Latest release, and an invalid tag is
          # handled by the manifest/changelog verification above.
          if current is None or "-" in version:
              print("false")
              sys.exit(0)
          for tag in sys.argv[2:]:
              other = parse(tag[1:]) if tag.startswith("v") else None
              if other is not None and other > current:
                  print("false")
                  sys.exit(0)
          print("true")
          PY
          )
          echo "Tag ${GITHUB_REF_NAME}: make_latest=${LATEST}"
          echo "latest=${LATEST}" >> "${GITHUB_OUTPUT}"

  # =========================================================================
  # 2. Build Source Distribution (sdist)
  # =========================================================================
  build-sdist:
    name: Build Source Distribution
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: dist/*

  # =========================================================================
  # 3. Build Multi-Platform Native Wheels (abi3)
  # =========================================================================
  build-wheels:
    name: Build Wheels (${{ matrix.os }}, ${{ matrix.target }})
    needs: [verify]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - os: macos-latest
            target: x86_64-apple-darwin
            manylinux: "off"
          - os: macos-latest
            target: aarch64-apple-darwin
            manylinux: "off"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: "off"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          sccache: false

      - name: Verify Linux Wheel manylinux Tag
        if: contains(matrix.target, 'linux')
        run: |
          python3 - <<'PY'
          import pathlib
          import sys

          expected = "manylinux_2_28"
          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          if not wheels:
              sys.exit("No wheels found in dist/")
          for wheel in wheels:
              print(f"Checking {wheel.name}")
              if expected not in wheel.name:
                  sys.exit(
                      f"ERROR: {wheel.name} does not carry the expected {expected} tag"
                  )
          print(f"All {len(wheels)} Linux wheel(s) carry the {expected} tag.")
          PY

      - name: Upload Wheel Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*

  # =========================================================================
  # 3b. Verify Linux Wheel Tags and Base-Only Install
  # =========================================================================
  verify-wheels:
    name: Verify Wheels (Py ${{ matrix.python-version }})
    needs: [verify, build-wheels]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Linux x86_64 Wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels-ubuntu-latest-x86_64-unknown-linux-gnu
          path: dist

      - name: Verify Downloaded Linux Wheel Tag
        run: |
          python3 - <<'PY'
          import pathlib
          import sys

          expected = "manylinux_2_28"
          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          if not wheels:
              sys.exit("No Linux x86_64 wheel found in dist/")
          for wheel in wheels:
              print(f"Checking {wheel.name}")
              if expected not in wheel.name:
                  sys.exit(f"ERROR: {wheel.name} does not carry the expected {expected} tag")
          print(f"All {len(wheels)} Linux x86_64 wheel(s) carry the {expected} tag.")
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install Wheel into Fresh Environment (No Extras)
        run: |
          uv venv --python ${{ matrix.python-version }} "${RUNNER_TEMP}/voyager-base"
          uv pip install --python "${RUNNER_TEMP}/voyager-base/bin/python" dist/*.whl

      - name: Run Base-Install Smoke Test
        run: |
          "${RUNNER_TEMP}/voyager-base/bin/python" -I scripts/smoke_base_install.py

  # =========================================================================
  # 4. GitHub Release Creation
  # =========================================================================
  release:
    name: Create GitHub Release
    needs: [verify, build-sdist, build-wheels, verify-wheels]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Built Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Extract Release Notes
        id: notes
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          python3 scripts/check_changelog.py --extract "${VERSION}" > release_notes.md
          cat release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Voyager OGM v${{ needs.verify.outputs.version }}
          body_path: release_notes.md
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          # Only the highest v* tag may become "Latest"; a patch on an older
          # maintenance line must not replace a newer minor release.
          make_latest: ${{ needs.verify.outputs.latest }}
          files: dist/*

  # =========================================================================
  # 5. TestPyPI Publish (Trusted Publishing, Every Tag)
  # =========================================================================
  publish-testpypi:
    name: Publish to TestPyPI
    needs: [verify, release]
    if: vars.TESTPYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/voyager-ogm
    permissions:
      id-token: write
    steps:
      - name: Download Artifacts for TestPyPI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # =========================================================================
  # 6. PyPI Publish (Trusted Publishing, Stable Tags Only)
  # =========================================================================
  pypi-publish:
    name: Publish to PyPI
    needs: [verify, release]
    if: vars.PYPI_PUBLISH == 'true' && needs.verify.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/voyager-ogm
    permissions:
      id-token: write
    steps:
      - name: Download Artifacts for PyPI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          # Keep re-runs safe: an existing filename is skipped instead of failing.
          skip-existing: true

  # =========================================================================
  # 7. crates.io Publish (Trusted Publishing, Every Tag)
  # =========================================================================
  publish-crates:
    name: Publish to crates.io
    needs: [verify, release]
    if: vars.CRATES_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/voyager-ogm
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish Crates in Dependency Order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail

          VERSION=$(python3 -c "
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path('Cargo.toml').read_text(encoding='utf-8'))
          print(data['workspace']['package']['version'])
          ")
          USER_AGENT="voyager-release (github.com/tanishq-kumar/voyager)"

          crate_exists() {
            curl -fsS --retry 3 -A "${USER_AGENT}" \
              "https://crates.io/api/v1/crates/$1/${VERSION}" >/dev/null
          }

          wait_for_crate() {
            for _ in $(seq 1 60); do
              if crate_exists "$1"; then
                echo "$1 ${VERSION} is visible on the crates.io index."
                return 0
              fi
              sleep 5
            done
            echo "::warning::$1 ${VERSION} is not visible on the crates.io index yet; continuing."
          }

          for crate in voyager-ogm voyager-drivers voyager-cli; do
            if crate_exists "${crate}"; then
              echo "::notice::${crate} ${VERSION} is already published; skipping."
              continue
            fi
            echo "Publishing ${crate} ${VERSION}..."
            cargo publish -p "${crate}" --locked
            # Dependent crates need the newly published version in the index.
            wait_for_crate "${crate}"
          done

name: Bug report
description: Report an error or unexpected behavior
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report an issue!
        Before reporting, please make sure to search existing open and closed issues.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and simple description of what went wrong.
      placeholder: Tell us what happened...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the issue.
      placeholder: |
        1. Run '...'
        2. Execute query '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Code Example
      description: A minimal reproducible example showing the problem.
      placeholder: |
        from voyager_ogm import Graph

        g = Graph(...)
        ...
      render: python
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: false

  - type: dropdown
    id: backend
    attributes:
      label: Database Backend
      description: Which database backend are you connecting to?
      options:
        - DuckDB
        - FalkorDB
        - Neo4j
        - Kùzu
        - Other / In-Memory
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and Voyager version.
      placeholder: "Windows 11 / Python 3.12 / Voyager 0.4.5-alpha.1"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, logs, error traces, or screenshots here.
    validations:
      required: false

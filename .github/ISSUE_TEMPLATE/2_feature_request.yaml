name: Feature request
description: Suggest a new idea or improvement for Voyager
title: "[FEATURE] "
labels: ["feature request"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature!
        Please check existing issues and discussions before opening a new request.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Need
      description: What problem are you trying to solve? Please explain in simple terms.
      placeholder: I am trying to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or feature you would like to see added.
      placeholder: It would be great if Voyager could...
    validations:
      required: true

  - type: textarea
    id: usage
    attributes:
      label: How It Would Be Used
      description: Example code or workflow of how you envision using this feature.
      placeholder: |
        from voyager_ogm import Graph

        ...
      render: python
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Did you consider other approaches or workarounds?
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, links, or screenshots here.
    validations:
      required: false

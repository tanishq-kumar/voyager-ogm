# GitHub Native Automated Release Notes Configuration
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  categories:
    - title: "Features and Capabilities"
      labels:
        - "feat"
        - "feature"
        - "enhancement"
    - title: "Performance Optimizations"
      labels:
        - "perf"
        - "performance"
        - "benchmarks"
    - title: "Bug Fixes and Correctness"
      labels:
        - "fix"
        - "bug"
        - "bugfix"
    - title: "Conformance and Testing (TCK)"
      labels:
        - "test"
        - "tck"
        - "conformance"
    - title: "Documentation"
      labels:
        - "docs"
        - "documentation"
    - title: "Maintenance and Tooling"
      labels:
        - "chore"
        - "ci"
        - "refactor"
        - "tooling"

  exclude:
    labels:
      - "ignore-for-release"
      - "skip-changelog"

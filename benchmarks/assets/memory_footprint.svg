<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" width="100%" height="100%" style="background:#0d1117; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; border-radius:12px; border:1px solid #30363d;">
  <style>
    .title { fill: #f0f6fc; font-size: 18px; font-weight: 700; }
    .subtitle { fill: #8b949e; font-size: 13px; }
    .label { fill: #c9d1d9; font-size: 14px; font-weight: 600; }
    .sublabel { fill: #8b949e; font-size: 11px; }
    .val { fill: #ffffff; font-size: 13px; font-weight: 700; }
    .badge { fill: #3fb950; font-size: 11px; font-weight: 700; }
    .badge-bg { fill: rgba(35, 134, 54, 0.2); stroke: #238636; stroke-width: 1; }
    .grid { stroke: #21262d; stroke-dasharray: 4,4; stroke-width: 1; }
  </style>

  <!-- Header -->
  <text x="32" y="42" class="title">Physical Memory Footprint (50,000 Entities)</text>
  <text x="32" y="64" class="subtitle">Lower is better -- Process Resident Set Size (RSS) Memory Delta (Megabytes)</text>

  <!-- Grid Lines -->
  <line x1="250" y1="90" x2="250" y2="270" class="grid" />
  <line x1="455" y1="90" x2="455" y2="270" class="grid" />
  <line x1="660" y1="90" x2="660" y2="270" class="grid" />

  <!-- Bar 1: Voyager / PyArrow -->
  <text x="32" y="118" class="label">Voyager / PyArrow</text>
  <text x="32" y="134" class="sublabel">Buffer raw nbytes: 2.38 MB</text>
  <rect x="250" y="102" width="27" height="36" rx="6" fill="#f97316" />
  <text x="289" y="125" class="val">3.32 MB</text>
  <rect x="690" y="108" width="118" height="24" rx="12" class="badge-bg" />
  <text x="749" y="124" text-anchor="middle" class="badge">92% LESS RAM</text>
  <!-- Bar 2: Python list[dict] -->
  <text x="32" y="180" class="label">Python list[dict]</text>
  <text x="32" y="196" class="sublabel">Standard Driver Records</text>
  <rect x="250" y="164" width="80" height="36" rx="6" fill="#3b82f6" />
  <text x="342" y="187" class="val">9.83 MB</text>
  <!-- Bar 3: Pydantic v2 Models -->
  <text x="32" y="242" class="label">Pydantic v2 Models</text>
  <text x="32" y="258" class="sublabel">50,000 Model Instances</text>
  <rect x="250" y="226" width="346" height="36" rx="6" fill="#8b5cf6" />
  <text x="608" y="249" class="val">42.23 MB</text>

  <!-- Footer Axis -->
  <line x1="250" y1="270" x2="660" y2="270" stroke="#30363d" stroke-width="1" />
  <text x="250" y="292" class="sublabel" text-anchor="middle">0 MB</text>
  <text x="455" y="292" class="sublabel" text-anchor="middle">25 MB</text>
  <text x="660" y="292" class="sublabel" text-anchor="middle">50 MB</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" width="100%" height="100%" style="background:#0d1117; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; border-radius:12px; border:1px solid #30363d;">
  <style>
    .title { fill: #f0f6fc; font-size: 18px; font-weight: 700; }
    .subtitle { fill: #8b949e; font-size: 13px; }
    .label { fill: #c9d1d9; font-size: 14px; font-weight: 600; }
    .sublabel { fill: #8b949e; font-size: 11px; }
    .val { fill: #ffffff; font-size: 13px; font-weight: 700; }
    .badge { fill: #3fb950; font-size: 11px; font-weight: 700; }
    .badge-bg { fill: rgba(35, 134, 54, 0.2); stroke: #238636; stroke-width: 1; }
    .grid { stroke: #21262d; stroke-dasharray: 4,4; stroke-width: 1; }
  </style>

  <!-- Header -->
  <text x="32" y="42" class="title">In-Memory Entity Hydration Speed</text>
  <text x="32" y="64" class="subtitle">Higher is better -- 10,000 graph nodes with 6 properties (Nodes / Second)</text>

  <!-- Grid Lines -->
  <line x1="250" y1="90" x2="250" y2="270" class="grid" />
  <line x1="420" y1="90" x2="420" y2="270" class="grid" />
  <line x1="591" y1="90" x2="591" y2="270" class="grid" />

  <!-- Bar 1: Voyager OGM -->
  <text x="32" y="118" class="label">Voyager OGM</text>
  <text x="32" y="134" class="sublabel">Zero-Copy Arrow C Stream</text>
  <rect x="250" y="102" width="346" height="36" rx="6" fill="#f97316" />
  <text x="608" y="125" class="val">1,013,607 /s</text>
  <rect x="690" y="108" width="118" height="24" rx="12" class="badge-bg" />
  <text x="749" y="124" text-anchor="middle" class="badge">44.0x FASTER</text>
  <!-- Bar 2: Pydantic v2 -->
  <text x="32" y="180" class="label">Pydantic v2</text>
  <text x="32" y="196" class="sublabel">Official Driver + BaseModel</text>
  <rect x="250" y="164" width="95" height="36" rx="6" fill="#8b5cf6" />
  <text x="357" y="187" class="val">280,899 /s</text>
  <!-- Bar 3: neomodel -->
  <text x="32" y="242" class="label">neomodel</text>
  <text x="32" y="258" class="sublabel">StructuredNode.inflate()</text>
  <rect x="250" y="226" width="8" height="36" rx="6" fill="#64748b" />
  <text x="270" y="249" class="val">23,016 /s</text>

  <!-- Footer Axis -->
  <line x1="250" y1="270" x2="660" y2="270" stroke="#30363d" stroke-width="1" />
  <text x="250" y="292" class="sublabel" text-anchor="middle">0</text>
  <text x="420" y="292" class="sublabel" text-anchor="middle">500,000</text>
  <text x="591" y="292" class="sublabel" text-anchor="middle">1,000,000 nodes/sec</text>
</svg>
[package]
name = "voyager-drivers"
description = "Client driver layer for Bolt (Neo4j, Memgraph), PostgreSQL wire (Apache AGE), and Redis/RESP (FalkorDB), with connection pooling and transactions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["neo4j", "memgraph", "falkordb", "postgresql", "database-driver"]
categories = ["database", "database-implementations", "network-programming", "asynchronous"]
readme = "README.md"
autobenches = false

[dependencies]
voyager-ogm = { workspace = true, features = ["serde", "arrow"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
parking_lot = { workspace = true }
url = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
arrow = { workspace = true }
arrow-schema = { workspace = true }
arrow-array = { workspace = true }
md-5 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }

# Optional dependency for head-to-head comparative driver benchmarks
neo4rs = { version = "0.8.0", optional = true }

[lints]
workspace = true

[features]
default = []
bench-driver = ["dep:neo4rs"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
proptest = "1.6"

[[bench]]
name = "bench_security_overhead"
harness = false

[[bench]]
name = "bench_driver_vs_voyager_drivers"
harness = false
required-features = ["bench-driver"]

[[bench]]
name = "bench_1m_driver_vs_voyager"
harness = false
required-features = ["bench-driver"]

[[bench]]
name = "bench_live_bolt"
harness = false

[[bench]]
name = "bench_jumbo_payloads"
harness = false


# md-5 is imported as `md5`; neo4rs is used only by benches behind the bench-driver feature
[package.metadata.cargo-machete]
ignored = ["md-5", "neo4rs"]

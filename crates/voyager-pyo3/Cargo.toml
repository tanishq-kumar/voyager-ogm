[package]
name = "voyager-pyo3"
description = "Python PyO3 bindings and Apache Arrow PyCapsule bridge for Voyager OGM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["python", "pyo3", "arrow", "bindings", "ffi"]
categories = ["api-bindings", "database"]
readme = "README.md"

[lib]
name = "_voyager_rs"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
voyager-ogm = { workspace = true, features = ["serde", "arrow"] }
voyager-drivers = { workspace = true, features = ["bolt", "postgres", "redis", "arrow"] }
tokio = { workspace = true }
arrow = { workspace = true }
pyo3 = { workspace = true }
pyo3-async-runtimes = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }

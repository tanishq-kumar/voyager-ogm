# cargo-deny configuration: `just deny` (also part of `just ci`).
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

# RustSec security advisories (vulnerable, unmaintained, yanked crates)
[advisories]
yanked = "deny"
ignore = [
    # Unmaintained crates pulled in only by neo4rs, an optional bench-only dependency
    # (voyager-drivers `bench-driver` feature, comparison benchmarks). Not in shipped builds.
    { id = "RUSTSEC-2025-0012", reason = "backoff: via neo4rs, bench-only" },
    { id = "RUSTSEC-2024-0384", reason = "instant: via neo4rs/backoff, bench-only" },
    { id = "RUSTSEC-2024-0436", reason = "paste: via neo4rs, bench-only" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile: via neo4rs, bench-only" },
    # chrono family declared unmaintained (chronotope/chrono#1768); all versions affected, no
    # replacement yet. Pulled in by arrow (shipped) and neo4rs (bench-only). Not a vulnerability.
    # Re-evaluate when arrow moves off chrono. Tracked in the security-hardening issue.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained: via arrow, no alternative yet" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz unmaintained: via neo4rs, bench-only" },
    { id = "RUSTSEC-2026-0559", reason = "chrono-tz-build unmaintained: build dep of chrono-tz, bench-only" },
]

# Every dependency must use a license compatible with MIT OR Apache-2.0
[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
]

[licenses.private]
ignore = true

# Duplicate versions of the same crate bloat compile time and binary size
[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

# Only crates.io; no git or unknown registries
[sources]
unknown-registry = "deny"
unknown-git = "deny"
